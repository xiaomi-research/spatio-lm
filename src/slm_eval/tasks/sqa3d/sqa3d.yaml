dataset_path: ./data/eval/sqa3d
dataset_kwargs:
  cache_dir: ./data/train-vlm/videos/scannet/videos
  load_from_disk: True
task: sqa3d
test_split: test
output_type: generate_until
doc_to_visual: !function utils.sqa3d_doc_to_visual
doc_to_text: !function utils.sqa3d_doc_to_text
doc_to_target: answers
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
# The return value of process_results will be used by metrics
process_results: !function utils.sqa3d_process_results
# Note that the metric name can be either a registed metric function (such as the case for GQA) or a key name returned by process_results
metric_list:
  - metric: EM-1
    aggregation: !function utils.sqa3d_em_1
    higher_is_better: true
  - metric: EM-R1
    aggregation: !function utils.sqa3d_em_r1
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "These are frames of a video.\n"
    mid_prompt: "\nAnswer the question briefly according to situation: "
    post_prompt: ""
metadata:
  - version: 0.0
