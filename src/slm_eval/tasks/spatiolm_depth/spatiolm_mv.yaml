metadata:
  - version: 0.1

dataset_path: ./data/eval/spatiolm_depth
dataset_kwargs:
  load_from_disk: True
test_split: multi_view

# Task for multiview depth estimation of SpatioLM
task: spatiolm_depth_mv
output_type: generate_until
doc_to_visual: !function utils_md.spatiolm_doc_to_visual
doc_to_text: !function utils_md.spatiolm_doc_to_text
doc_to_target: !function utils_md.spatiolm_doc_to_target
generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  do_sample: false
# The return value of process_results will be used by metrics
process_results: !function utils_md.spatiolm_process_results
# Note that the metric name can be either a registed metric function (such as the case for GQA) or a key name returned by process_results
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    mid_prompt: ""
    post_prompt: "Measure the distance to me for marked point in meters and provide the direct answer (just in numeric)."

metric_list:
  - metric: metric_depth
    aggregation: !function utils_md.detal1_absrel_aggregate_results
    higher_is_better: null
