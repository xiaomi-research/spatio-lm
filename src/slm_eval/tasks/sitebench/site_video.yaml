# dataset_path: franky-veteran/SITE-Bench
dataset_path: ./data/eval/site_bench
dataset_kwargs:
  token: True
  load_from_disk: True
test_split: video_test

task: "site_bench_video"
output_type: generate_until
generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
doc_to_visual: !function utils.spatial_doc_to_visual_video
doc_to_text: !function utils.spatial_doc_to_text_video
doc_to_target: "answer"
process_results: !function utils.spatial_process_results

lmms_eval_specific_kwargs:
  default:
      pre_prompt: "Select the best answer to the following multiple-choice question based on the video."
      post_prompt: "Answer with the option's letter from the given choices directly."
  gemini_api:
      pre_prompt: "<video>"

metric_list:
  - metric: accuracy
    aggregation: !function utils.spatial_aggregate_results
    higher_is_better: true

metadata:
  - version: 0.0
