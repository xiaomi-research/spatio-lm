dataset_path: ./data/eval/MindCube
dataset_kwargs:
  token: True
  load_from_disk: True

test_split: tiny
task: mindcube_tiny
output_type: generate_until
doc_to_visual: !function utils.mindcube_doc_to_visual
doc_to_text: !function utils.mindcube_doc_to_text
doc_to_target: gt_answer

generation_kwargs:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0

lmms_eval_specific_kwargs:
  default:
    prompt_format: mcq
    pre_prompt: ""
    post_prompt: "Answer with the option's letter from the given choices directly."

# The return value of process_results will be used by metrics
process_results: !function utils.mindcube_process_results

metric_list:
  - metric: accuracy
    aggregation: !function utils.mindcube_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0
